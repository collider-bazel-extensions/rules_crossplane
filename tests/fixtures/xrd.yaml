# XRD for the smoke XR. render_flags passes it with
# `--xrd=$(rootpath ...)` to cover `args` + `data`.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xsmokes.smoke.example.com
spec:
  group: smoke.example.com
  names:
    kind: XSmoke
    plural: xsmokes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
