# For render_cleanup_test: the container starts, but crank dials it at
# 192.0.2.1 (TEST-NET-1, unroutable), so the render hangs until the run
# is killed or `--timeout` expires.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    render.crossplane.io/runtime-docker-target: 192.0.2.1
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
